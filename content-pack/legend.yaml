# legend.yaml — codes, tiers and flags, for outside readers.
legend:
- item: What this is
  meaning: Curated pathways of plant perception — how plants sense their surroundings and their own state, from stimulus to
    receptor to response — each stage tied to a verified published abstract.
- item: Stage columns
  meaning: stimulus → receptor / transducer → cascade → signal route → integration → response.
- item: provenance codes
  meaning: A = quoted or closely tracked from a verified abstract · K = curator knowledge, not verified against an abstract
- item: transducer_tier
  meaning: B1 established · B2 partial · B3 unknown or inferred; set in curation
- item: row_status
  meaning: curated = accepted in curation; only curated rows are shown as paths
- item: ⚑
  meaning: a contested or partly supported mechanism, or dual membership (a path listed under two branches)
- item: citation_verified
  meaning: 'yes (abstracts) / partly (abstracts) / no: every, some or none of the row''s key citations verified at abstract
    level'
- item: evidence_species
  meaning: Arabidopsis thaliana unless stated. Senses Arabidopsis lacks, such as nodulation, come from other species and carry
    the 🌱 other-species badge.
- item: empty stage
  meaning: 'a gap: no verified source supports this stage yet'
