classes:
  - { id: curation,   what: "Curated rows, tree, shared hardware, legend (source/curation)", recheck_days: 180, as_of: 2026-11-24, files: [paths.yaml, hierarchy.yaml, hubs.yaml, legend.yaml], how: "edit source/curation/paths.yaml; tools/export_handoff.py; tools/assemble_pack.py; diff" }
  - { id: reference,  what: "DOI metadata and abstracts",                       recheck_days: 365, files: [references.yaml], how: "harvest_openalex.py (OPENALEX_API_KEY) then tools/verify_refs.py" }
  - { id: molecule,   what: "UniProt identity and function text (taxon 3702)",  recheck_days: 180, files: [molecules.yaml], how: "harvest_structures.py inventory --taxon 3702; tools/build_molecules.py" }
  - { id: structure,  what: "PDB entries, AlphaFold DB models, bundled files",  recheck_days: 180, as_of: 2026-11-19, files: [structures.yaml], how: "harvest_structures.py inventory + download; review new featured picks for peptides and namesakes (app-methods §4.4)" }
  - { id: small-molecule, what: "PubChem identity and 3D conformers",           recheck_days: 180, files: [small-molecules.yaml], how: "harvest_structures.py smallmolecules with a fresh output file; tools/build_small_molecules.py" }
  - { id: ontology,   what: "Plant Ontology, Gene Ontology and ChEBI records quoted in anatomy.yaml and glossary.yaml", recheck_days: 365, files: [anatomy.yaml, glossary.yaml], how: "harvest_uberon.py fetch (anatomy) and tools/harvest_glossary.py (glossary) with fresh output files; tools/build_anatomy.py, tools/build_glossary.py; obsolete terms are refused" }
harvests:
  - { id: openalex,   script: ../../tools/harvest_openalex.py,    writes: source/literature.json }
  - { id: structures, script: ../../tools/harvest_structures.py,  writes: source/structures-inventory.json }
  - { id: anatomy,    script: ../../tools/harvest_uberon.py,      writes: notes/research/anatomy-harvest.json }
sweeps:
  - { id: biannual, every_days: 182, scope: "new PDB entries and AlphaFold versions; literature for gap stages (signal routes, integration) and for candidate senses (replications)" }
  - { id: annual,   every_days: 365, scope: "re-verify references; Plant Ontology term changes; staleness report" }
