# basis: 'ontology, verbatim' = quoted from the named record (UI-31); 'app convention' = the app's own notation.
- id: pathway-stage
  term: Pathway stage
  kind: notation
  variants:
  - stage
  - stages
  short: One step of a path, from stimulus to response.
  definition: '<!-- framing -->One of the six steps every path is curated along: **stimulus**, **receptor / transducer**,
    **cascade**, **signal route**, **integration** and **response**. Each stage holds a short text value taken from a verified
    abstract, or is left as a gap.'
  basis: app convention
  concept: how-a-path-is-curated
- id: stimulus
  term: Stimulus
  kind: notation
  variants:
  - stimuli
  short: What a path senses.
  definition: '<!-- framing -->The first stage of a path: what the plant senses, such as blue light, touch or a bacterial
    molecule, as curated.'
  basis: app convention
  concept: how-a-path-is-curated
- id: receptor-transducer
  term: Receptor / transducer
  kind: notation
  variants:
  - receptor
  - receptors
  - transducer
  - transducers
  short: The molecule that detects the stimulus and turns it into a cellular signal.
  definition: <!-- framing -->The stage naming the molecule or molecules that detect the stimulus and turn it into a cellular
    signal. These are drawn as molecule nodes in the navigator and graded by the receptor tier.
  basis: app convention
  concept: how-a-path-is-curated
- id: cascade
  term: Cascade
  kind: notation
  variants:
  - cascades
  short: The signalling steps right after the receptor.
  definition: <!-- framing -->The stage naming the signalling steps inside the cell that follow the receptor, such as a kinase
    activating a channel, where curated.
  basis: app convention
  concept: how-a-path-is-curated
- id: signal-route
  term: Signal route
  kind: notation
  variants:
  - signal routes
  - long-distance signal
  short: How the signal travels beyond the sensing cell.
  definition: '<!-- framing -->The stage naming how the signal travels beyond the cell that sensed it: plants have no nerves,
    so this is a long-distance signal such as a calcium or electrical wave, a hormone moving in the phloem or xylem, or a
    mobile peptide. Often a gap.'
  basis: app convention
  concept: how-a-path-is-curated
- id: integration
  term: Integration
  kind: notation
  variants: []
  short: Where the signal is combined with others.
  definition: <!-- framing -->The stage naming where the signal is weighed against other cues, such as hormone crosstalk or
    the circadian clock. Plants integrate in many tissues rather than in one centre.
  basis: app convention
  concept: how-a-path-is-curated
- id: response
  term: Response
  kind: notation
  variants:
  - response role
  short: What the plant does.
  definition: '<!-- framing -->The last stage: what the plant does in response, such as closing its stomata, bending toward
    light or switching on defences, with its **response role** (what the response achieves) where curated.'
  basis: app convention
  concept: how-a-path-is-curated
- id: receptor-tier
  term: Receptor tier
  kind: notation
  variants:
  - tier
  - tiers
  - tier B1
  - tier B2
  - tier B3
  - transducer tier
  short: 'How well established the sensing molecule is: B1 established, B2 partial, B3 unknown or inferred.'
  definition: '<!-- framing -->A grade for the receptor of a path: **B1** established, **B2** partial, **B3** unknown or inferred.
    One tier per path, set in curation. Read it with the evidence species.'
  basis: app convention
  concept: how-a-path-is-curated
- id: gap
  term: Gap
  kind: notation
  variants:
  - gaps
  - not curated
  short: 'A stage with no verified source yet: unknown, not absent.'
  definition: <!-- framing -->A stage with no curated value because no verified source supports it yet. A gap means *not yet
    sourced*, never *nothing there*. The app draws gaps as dashed 'not curated' cards.
  basis: app convention
  concept: how-a-path-is-curated
- id: contested
  term: Contested
  kind: notation
  variants:
  - ⚑
  short: ⚑ marks a contested mechanism, a partial placement or dual membership.
  definition: '<!-- framing -->The ⚑ mark: the field holds a mechanism that is contested or only partly supported, or the
    path belongs to two branches. The field stays in the data and is shown flagged, never resolved by the app.'
  basis: app convention
  concept: how-a-path-is-curated
- id: dual-membership
  term: Dual membership
  kind: notation
  variants:
  - dual
  short: A path listed under two branches of the tree.
  definition: <!-- framing -->A path that belongs to two branches of the perception tree, such as warm temperature sensed
    by a light receptor. It is listed in both and keeps one set of nodes.
  basis: app convention
- id: provenance
  term: Provenance
  kind: notation
  variants:
  - provenance codes
  short: A = tracks a verified abstract; K = curator knowledge, not verified.
  definition: '<!-- framing -->Where a path''s text comes from: **A** quoted or closely tracked from a verified abstract,
    or **K** curator knowledge not verified against an abstract.'
  basis: app convention
  concept: how-a-path-is-curated
- id: evidence-species
  term: Evidence species
  kind: notation
  variants:
  - other species
  - 🌱
  short: The organism behind a path's key evidence; Arabidopsis unless stated.
  definition: <!-- framing -->The organism behind the key evidence for a path. Arabidopsis thaliana is the reference. Senses
    Arabidopsis lacks, such as nodulation with rhizobia, come from other species and carry the 🌱 other-species badge.
  basis: app convention
  concept: how-a-path-is-curated
- id: verified-citation
