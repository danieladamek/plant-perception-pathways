- id: root
  term: Root
  kind: science
  variants:
  - aerial root
  - climbing root
  - radix
  short: Roots function in the absorption of water and inorganic nutrients, anchoring the plant body to the substrate and
    supporting it, storage of food and nutrients, and vegetative reproduction.
  definition: Roots function in the absorption of water and inorganic nutrients, anchoring the plant body to the substrate
    and supporting it, storage of food and nutrients, and vegetative reproduction. The roots of most vascular plant species
    enter into symbiosis with soil-borne microorganisms. Roots are usually positively geotropic and found underground, although
    there are many exceptions such as the aerial roots of orchids. Roots often form secondary thickening from the root lateral
    meristem (PO:0006308). Commonly thought of as one of the three basic parts of the plant body, along with the shoot axis
    (PO:0025029) and leaves (PO:0025034).
  basis: ontology, verbatim
  definition_source:
    id: PO:0009005
