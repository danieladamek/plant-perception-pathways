# hierarchy.yaml — the plant perception tree, one of several valid divisions. A leaf marked dual: true lists a
# path that also belongs to another branch (⚑ dual membership).
tree:
  name: Plant perception
  children:
  - name: Light
    children:
    - name: red / far-red
      path_ids:
      - PL01
    - name: warm ambient temperature
      path_ids:
      - PL02
      dual: true
    - name: blue (phototropism)
      path_ids:
      - PL03
    - name: blue (chloroplast avoidance)
      path_ids:
      - PL04
    - name: blue (stomatal opening)
      path_ids:
      - PL05
    - name: blue (de-etiolation)
      path_ids:
      - PL06
    - name: UV-B
      path_ids:
      - PL07
    - name: UV-B (phototropism)
      path_ids:
      - PL08
    - name: shade (low red:far-red)
      path_ids:
      - PL09
  - name: Temperature
    children:
    - name: warm ambient temperature
      path_ids:
      - PL02
    - name: cold (chilling and freezing)
      path_ids:
      - PC01
    - name: prolonged cold (vernalisation)
      path_ids:
      - PC02
    - name: warm ambient temperature (ELF3)
      path_ids:
      - PH01
    - name: warm daytime temperature (PIF7 RNA)
      path_ids:
      - PH02
    - name: ambient temperature (H2A.Z)
      path_ids:
      - PH03
    - name: high temperature (architecture)
      path_ids:
      - PH04
    - name: heat (thermotolerance)
      path_ids:
      - PH05
  - name: Redox (ROS)
    children:
    - name: reactive oxygen (H2O2)
      path_ids:
      - PX01
  - name: Osmotic and salt
    children:
    - name: hyperosmolality
      path_ids:
      - PX02
    - name: cell swelling
      path_ids:
      - PT05
    - name: salt (Na+)
      path_ids:
      - PX04
    - name: salt-softened cell wall
      path_ids:
      - PX05
  - name: Wounding and herbivores
    children:
    - name: extracellular ATP
      path_ids:
      - PX03
    - name: wounding (systemic)
      path_ids:
      - PW01
    - name: damage peptide (AtPep1)
      path_ids:
      - PW02
    - name: insect eggs (oviposition)
      path_ids:
      - PW03
  - name: Mechanical
    children:
    - name: substrate hardness (root)
      path_ids:
      - PT01
    - name: touch (root)
      path_ids:
      - PT02
    - name: touch and bending
      path_ids:
      - PT03
    - name: repeated touch, wind, rain
      path_ids:
      - PT04
    - name: cell swelling
      path_ids:
      - PT05
      dual: true
    - name: membrane tension (pollen)
      path_ids:
      - PT06
    - name: tissue stress (shoot apex)
      path_ids:
      - PT08
    - name: salt-softened cell wall
      path_ids:
      - PX05
      dual: true
  - name: 'Pathogens: pattern recognition'
    children:
    - name: bacterial flagellin (flg22)
      path_ids:
      - PP01
    - name: bacterial surface molecules (guard cells)
      path_ids:
      - PP02
    - name: bacterial EF-Tu
      path_ids:
      - PP03
    - name: fungal chitin
      path_ids:
      - PP04
    - name: pathogen effectors (NLR immunity)
      path_ids:
      - PP05
    - name: systemic acquired resistance (salicylic acid)
      path_ids:
      - PP06
  - name: Gravity
    children:
    - name: organ reorientation (gravitropism)
      path_ids:
      - PG01
  - name: Water
    children:
    - name: drought (ABA in guard cells)
      path_ids:
      - PD01
    - name: root dehydration (long-distance)
      path_ids:
      - PD02
    - name: local water contact (hydropatterning)
      path_ids:
      - PD03
    - name: moisture gradient (hydrotropism)
      path_ids:
      - PD04
    - name: low oxygen (flooding, hypoxia)
      path_ids:
      - PO01
  - name: Nutrients
    children:
    - name: nitrate (primary response)
      path_ids:
      - PN01
    - name: low nitrate (lateral roots)
      path_ids:
      - PN02
    - name: nitrogen demand (systemic)
      path_ids:
      - PN03
    - name: cellular phosphate
      path_ids:
      - PN04
    - name: low phosphate at the root tip
      path_ids:
      - PN05
    - name: iron
      path_ids:
      - PN06
  - name: Chemical cues
    children:
    - name: ethylene (gas)
      path_ids:
      - PE01
    - name: smoke (karrikins)
      path_ids:
      - PK01
  - name: CO2
    children:
    - name: elevated CO2 (stomatal closure)
      path_ids:
      - PCD01
    - name: elevated CO2 (stomatal density)
      path_ids:
      - PCD02
  - name: Symbionts
    children:
    - name: rhizobial Nod factor (legumes)
      path_ids:
      - PS01
    - name: arbuscular mycorrhizal fungi
      path_ids:
      - PS02
  - name: Self/non-self
    children:
    - name: self pollen (self-incompatibility)
      path_ids:
      - PSI01
    - name: female attractant (pollen tube guidance)
      path_ids:
      - PSI02
  - name: Time (clock)
    children:
    - name: light entrainment
      path_ids:
      - PCL01
    - name: sugar entrainment ('metabolic dawn')
      path_ids:
      - PCL02
    - name: day length (photoperiod)
      path_ids:
      - PCL03
  - name: Candidate senses (contested)
    children:
    - name: herbivore chewing vibrations
      path_ids:
      - PZ01
    - name: pollinator sound
      path_ids:
      - PZ02
    - name: sound of water
      path_ids:
      - PZ03
    - name: kin recognition (root exudates)
      path_ids:
      - PZ04
    - name: kin recognition (light)
      path_ids:
      - PZ05
    - name: magnetic field
      path_ids:
      - PZ06
    - name: associative learning
      path_ids:
      - PZ07
