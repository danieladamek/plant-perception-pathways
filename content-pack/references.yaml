  abstract: Microbial entry into host tissue is a critical first step in causing infection in animals and plants. In plants,
    it has been assumed that microscopic surface openings, such as stomata, serve as passive ports of bacterial entry during
    infection. Surprisingly, we found that stomatal closure is part of a plant innate immune response to restrict bacterial
    invasion. Stomatal guard cells of Arabidopsis perceive bacterial surface molecules, which requires the FLS2 receptor,
    production of nitric oxide, and the guard-cell-specific OST1 kinase. To circumvent this innate immune response, plant
    pathogenic bacteria have evolved specific virulence factors to effectively cause stomatal reopening as an important pathogenesis
