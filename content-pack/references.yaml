  abstract: Jasmonates are essential phytohormones for plant development and survival. However, the molecular details of their
    signalling pathway remain largely unknown. The identification more than a decade ago of COI1 as an F-box protein suggested
    the existence of a repressor of jasmonate responses that is targeted by the SCF(COI1) complex for proteasome degradation
