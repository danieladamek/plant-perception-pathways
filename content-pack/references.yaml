  abstract: The phototropins (phots) are light-activated kinases that are critical for plant physiology and the many diverse
    optogenetic tools that they have inspired. Phototropins combine two blue-light-sensing Light-Oxygen-Voltage (LOV) domains
    (LOV1 and LOV2) and a C-terminal serine/threonine kinase domain, using the LOV domains to control the catalytic activity
    of the kinase. While much is known about the structure and photochemistry of the light-perceiving LOV domains, particularly
    in how activation of the LOV2 domain triggers the unfolding of alpha helices that communicate the light signal to the
    kinase domain, many questions about phot structure and mechanism remain. Recent studies have made progress addressing
    these questions by utilizing small-angle X-ray scattering (SAXS) and other biophysical approaches to study multidomain
    phots from Chlamydomonas and Arabidopsis, leading to models where the domains have an extended linear arrangement, with
    the regulatory LOV2 domain contacting the kinase domain N-lobe. We discuss this and other advances that have improved
    structural and mechanistic understanding of phot regulation in this review, along with the challenges that will have to
    be overcome to obtain high-resolution structural information on these exciting photoreceptors. Such information will be
    essential to advancing fundamental understanding of plant physiology while enabling engineering efforts at both the whole
    plant and molecular levels.
