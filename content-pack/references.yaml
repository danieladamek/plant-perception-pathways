  abstract: Glutamate has dual roles in metabolism and signaling; thus, signaling functions must be isolatable and distinct
    from metabolic fluctuations, as seen in low-glutamate domains at synapses. In plants, wounding triggers electrical and
    calcium (Ca 2+ ) signaling, which involve homologs of mammalian glutamate receptors. The hydraulic dispersal and squeeze-cell
    hypotheses implicate pressure as a key component of systemic signaling. Here, we identify the stretch-activated anion
    channel MSL10 as necessary for proper wound-induced electrical and Ca 2+ signaling. Wound gene induction, genetics, and
    Ca 2+ imaging indicate that MSL10 acts in the same pathway as the glutamate receptor–like proteins (GLRs). Analogous to
    mammalian NMDA glutamate receptors, GLRs may serve as coincidence detectors gated by the combined requirement for ligand
