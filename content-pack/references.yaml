  abstract: Following a previous microbial inoculation, plants can induce broad-spectrum immunity to pathogen infection, a
    phenomenon known as systemic acquired resistance (SAR). SAR establishment in Arabidopsis thaliana is regulated by the
    Lys catabolite pipecolic acid (Pip) and flavin-dependent-monooxygenase1 (FMO1). Here, we show that elevated Pip is sufficient
