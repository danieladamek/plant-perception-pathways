  abstract: The dynamic light environment of vegetation canopies is perceived by phytochromes, cryptochromes, phototropins,
    and UV RESISTANCE LOCUS 8 (UVR8). These receptors control avoidance responses to preclude exposure to limiting or excessive
    light and acclimation responses to cope with conditions that cannot be avoided. The low red/far-red ratios of shade light
    reduce phytochrome B activity, which allows PHYTOCHROME INTERACTING FACTORS (PIFs) to directly activate the transcription
    of auxin-synthesis genes, leading to shade-avoidance responses. Direct PIF interaction with DELLA proteins links gibberellin
