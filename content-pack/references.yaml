  abstract: Temperature is a major environmental cue affecting plant growth and development. Plants often experience higher
    temperatures in the context of a 24 h day-night cycle, with temperatures peaking in the middle of the day. Here, we find
    that the transcript encoding the bHLH transcription factor PIF7 undergoes a direct increase in translation in response
    to warmer temperature. Diurnal expression of PIF7 transcript gates this response, allowing PIF7 protein to quickly accumulate
