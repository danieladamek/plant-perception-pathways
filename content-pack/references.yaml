  abstract: Exposure of Arabidopsis plants to high temperature (28 degrees C) results in a dramatic change in plant development.
    Responses to high temperature include rapid extension of plant axes, leaf hyponasty, and early flowering. These phenotypes
    parallel plant responses to the threat of vegetational shade and have been shown to involve the hormone auxin. In this
    work, we demonstrate that high temperature-induced architectural adaptations are mediated through the bHLH transcriptional
    regulator PHYTOCHROME INTERACTING FACTOR 4 (PIF4). Roles for PIF4 have previously been established in both light and gibberellin
    (GA) signaling, through interactions with phytochromes and DELLA proteins, respectively. Mutants deficient in PIF4 do
    not display elongation responses or leaf hyponasty upon transfer to high temperature. High temperature-mediated induction
    of the auxin-responsive gene IAA29 is also abolished in these plants. An early flowering response to high temperature
