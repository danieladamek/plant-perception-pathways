  abstract: Plants grown at high densities perceive a decrease in the red to far-red (R:FR) ratio of incoming light, resulting
    from absorption of red light by canopy leaves and reflection of far-red light from neighboring plants. These changes in
    light quality trigger a series of responses known collectively as the shade avoidance syndrome. During shade avoidance,
    stems elongate at the expense of leaf and storage organ expansion, branching is inhibited, and flowering is accelerated.
    We identified several loci in Arabidopsis, mutations in which lead to plants defective in multiple shade avoidance responses.
    Here we describe TAA1, an aminotransferase, and show that TAA1 catalyzes the formation of indole-3-pyruvic acid (IPA)
    from L-tryptophan (L-Trp), the first step in a previously proposed, but uncharacterized, auxin biosynthetic pathway. This
    pathway is rapidly deployed to synthesize auxin at the high levels required to initiate the multiple changes in body plan
    associated with shade avoidance.
