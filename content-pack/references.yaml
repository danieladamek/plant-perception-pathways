  abstract: 'HYPOTHESES: The drive to survive is a biological universal. Intelligent behaviour is usually recognized when
    individual organisms including plants, in the face of fiercely competitive or adverse, real-world circumstances, change
    their behaviour to improve their probability of survival. SCOPE: This article explains the potential relationship of intelligence
    to adaptability and emphasizes the need to recognize individual variation in intelligence showing it to be goal directed
    and thus being purposeful. Intelligent behaviour in single cells and microbes is frequently reported. Individual variation
    might be underpinned by a novel learning mechanism, described here in detail. The requirements for real-world circumstances
    are outlined, and the relationship to organic selection is indicated together with niche construction as a good example
    of intentional behaviour that should improve survival. Adaptability is important in crop development but the term may
    be complex incorporating numerous behavioural traits some of which are indicated. CONCLUSION: There is real biological
    benefit to regarding plants as intelligent both from the fundamental issue of understanding plant life but also from providing
    a direction for fundamental future research and in crop breeding.'
