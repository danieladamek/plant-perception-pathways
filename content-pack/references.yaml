  abstract: Timely perception of adverse environmental changes is critical for survival. Dynamic changes in gases are important
    cues for plants to sense environmental perturbations, such as submergence. In Arabidopsis thaliana, changes in oxygen
    and nitric oxide (NO) control the stability of ERFVII transcription factors. ERFVII proteolysis is regulated by the N-degron
    pathway and mediates adaptation to flooding-induced hypoxia. However, how plants detect and transduce early submergence
    signals remains elusive. Here we show that plants can rapidly detect submergence through passive ethylene entrapment and
    use this signal to pre-adapt to impending hypoxia. Ethylene can enhance ERFVII stability prior to hypoxia by increasing
    the NO-scavenger PHYTOGLOBIN1. This ethylene-mediated NO depletion and consequent ERFVII accumulation pre-adapts plants
