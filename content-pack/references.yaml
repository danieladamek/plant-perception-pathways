    in Arabidopsis requires the transcription cofactor nonexpresser of PR genes 1 (NPR1), the degradation of which acts as
    a molecular switch. Here we show that the NPR1 paralogues NPR3 and NPR4 are SA receptors that bind SA with different affinities.
