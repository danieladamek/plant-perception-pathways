  abstract: Plants sense potential microbial invaders by using pattern-recognition receptors to recognize pathogen-associated
    molecular patterns (PAMPs). In Arabidopsis thaliana, the leucine-rich repeat receptor kinases flagellin-sensitive 2 (FLS2)
    (ref. 2) and elongation factor Tu receptor (EFR) (ref. 3) act as pattern-recognition receptors for the bacterial PAMPs
    flagellin and elongation factor Tu (EF-Tu) (ref. 5) and contribute to resistance against bacterial pathogens. Little is
    known about the molecular mechanisms that link receptor activation to intracellular signal transduction. Here we show
    that BAK1 (BRI1-associated receptor kinase 1), a leucine-rich repeat receptor-like kinase that has been reported to regulate
    the brassinosteroid receptor BRI1 (refs 6,7), is involved in signalling by FLS2 and EFR. Plants carrying bak1 mutations
    show normal flagellin binding but abnormal early and late flagellin-triggered responses, indicating that BAK1 acts as
    a positive regulator in signalling. The bak1-mutant plants also show a reduction in early, but not late, EF-Tu-triggered
    responses. The decrease in responses to PAMPs is not due to reduced sensitivity to brassinosteroids. We provide evidence
