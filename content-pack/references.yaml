  abstract: Chloroplasts relocate their positions in a cell in response to the intensity of incident light, moving to the
    side wall of the cell to avoid strong light, but gathering at the front face under weak light to maximize light interception.
    Here, Arabidopsis thaliana mutants defective in the avoidance response were isolated, and the mutated gene was identified
    as NPL1 (NPH-like 1), a homolog of NPH1 (nonphototropic hypocotyl 1), a blue light receptor used in phototropism. Hence,
    NPL1 is likely a blue light receptor regulating the avoidance response under strong light.
