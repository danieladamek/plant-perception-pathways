  abstract: Winter-annual ecotypes of Arabidopsis are relatively late flowering, unless the flowering of these ecotypes is
    promoted by exposure to cold (vernalization). This vernalization-suppressible, late-flowering phenotype results from the
    presence of dominant, late-flowering alleles at two loci, FRIGIDA (FRI) and FLOWERING LOCUS C (FLC). In this study, we
    report that flc null mutations result in early flowering, demonstrating that the role of active FLC alleles is to repress
