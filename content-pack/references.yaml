  abstract: Plant germination and growth can be influenced by sound, but the ecological significance of these responses is
    unclear. We asked whether acoustic energy generated by the feeding of insect herbivores was detected by plants. We report
    that the vibrations caused by insect feeding can elicit chemical defenses. Arabidopsis thaliana (L.) rosettes pre-treated
    with the vibrations caused by caterpillar feeding had higher levels of glucosinolate and anthocyanin defenses when subsequently
    fed upon by Pieris rapae (L.) caterpillars than did untreated plants. The plants also discriminated between the vibrations
    caused by chewing and those caused by wind or insect song. Plants thus respond to herbivore-generated vibrations in a
    selective and ecologically meaningful way. A vibration signaling pathway would complement the known signaling pathways
