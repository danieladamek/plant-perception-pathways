  abstract: Plants are responsive to temperature, and some species can distinguish differences of 1°C. In Arabidopsis, warmer
    temperature accelerates flowering and increases elongation growth (thermomorphogenesis). However, the mechanisms of temperature
    perception are largely unknown. We describe a major thermosensory role for the phytochromes (red light receptors) during
    the night. Phytochrome null plants display a constitutive warm-temperature response, and consistent with this, we show
    in this background that the warm-temperature transcriptome becomes derepressed at low temperatures. We found that phytochrome
    B (phyB) directly associates with the promoters of key target genes in a temperature-dependent manner. The rate of phyB
    inactivation is proportional to temperature in the dark, enabling phytochromes to function as thermal timers that integrate
    temperature information over the course of the night.
