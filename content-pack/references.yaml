  abstract: The circadian clock is essential for coordinating the proper phasing of many important cellular processes. Robust
    cycling of key clock elements is required to maintain strong circadian oscillations of these clock-controlled outputs.
    Rhythmic expression of the Arabidopsis thaliana F-box protein ZEITLUPE (ZTL) is necessary to sustain a normal circadian
    period by controlling the proteasome-dependent degradation of a central clock protein, TIMING OF CAB EXPRESSION 1 (TOC1).
    ZTL messenger RNA is constitutively expressed, but ZTL protein levels oscillate with a threefold change in amplitude through
    an unknown mechanism. Here we show that GIGANTEA (GI) is essential to establish and sustain oscillations of ZTL by a direct
    protein-protein interaction. GI, a large plant-specific protein with a previously undefined molecular role, stabilizes
    ZTL in vivo. Furthermore, the ZTL-GI interaction is strongly and specifically enhanced by blue light, through the amino-terminal
    flavin-binding LIGHT, OXYGEN OR VOLTAGE (LOV) domain of ZTL. Mutations within this domain greatly diminish ZTL-GI interactions,
    leading to strongly reduced ZTL levels. Notably, a C82A mutation in the LOV domain, implicated in the flavin-dependent
    photochemistry, eliminates blue-light-enhanced binding of GI to ZTL. These data establish ZTL as a blue-light photoreceptor,
    which facilitates its own stability through a blue-light-enhanced GI interaction. Because the regulation of GI transcription
    is clock-controlled, consequent GI protein cycling confers a post-translational rhythm on ZTL protein. This mechanism
    of establishing and sustaining robust oscillations of ZTL results in the high-amplitude TOC1 rhythms necessary for proper
    clock function.
