  abstract: Cryptochromes are flavoprotein photoreceptors first identified in Arabidopsis thaliana, where they play key roles
    in growth and development. Subsequently identified in prokaryotes, archaea, and many eukaryotes, cryptochromes function
    in the animal circadian clock and are proposed as magnetoreceptors in migratory birds. Cryptochromes are closely structurally
    related to photolyases, evolutionarily ancient flavoproteins that catalyze light-dependent DNA repair. Here, we review
    the structural, photochemical, and molecular properties of cry-DASH, plant, and animal cryptochromes in relation to biological
    signaling mechanisms and uncover common features that may contribute to better understanding the function of cryptochromes
    in diverse systems including in man.
