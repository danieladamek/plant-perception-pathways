  abstract: Environmental stimuli, including elevated carbon dioxide levels, regulate stomatal development; however, the key
    mechanisms mediating the perception and relay of the CO2 signal to the stomatal development machinery remain elusive.
    To adapt CO2 intake to water loss, plants regulate the development of stomatal gas exchange pores in the aerial epidermis.
    A diverse range of plant species show a decrease in stomatal density in response to the continuing rise in atmospheric
    CO2 (ref. 4). To date, one mutant that exhibits deregulation of this CO2-controlled stomatal development response, hic
    (which is defective in cell-wall wax biosynthesis, ref. 5), has been identified. Here we show that recently isolated Arabidopsis
    thaliana β-carbonic anhydrase double mutants (ca1 ca4) exhibit an inversion in their response to elevated CO2, showing
    increased stomatal development at elevated CO2 levels. We characterized the mechanisms mediating this response and identified
    an extracellular signalling pathway involved in the regulation of CO2-controlled stomatal development by carbonic anhydrases.
    RNA-seq analyses of transcripts show that the extracellular pro-peptide-encoding gene EPIDERMAL PATTERNING FACTOR 2 (EPF2),
    but not EPF1 (ref. 9), is induced in wild-type leaves but not in ca1 ca4 mutant leaves at elevated CO2 levels. Moreover,
    EPF2 is essential for CO2 control of stomatal development. Using cell-wall proteomic analyses and CO2-dependent transcriptomic
    analyses, we identified a novel CO2-induced extracellular protease, CRSP (CO2 RESPONSE SECRETED PROTEASE), as a mediator
    of CO2-controlled stomatal development. Our results identify mechanisms and genes that function in the repression of stomatal
    development in leaves during atmospheric CO2 elevation, including the carbonic-anhydrase-encoding genes CA1 and CA4 and
    the secreted protease CRSP, which cleaves the pro-peptide EPF2, in turn repressing stomatal development. Elucidation of
    these mechanisms advances the understanding of how plants perceive and relay the elevated CO2 signal and provides a framework
    to guide future research into how environmental challenges can modulate gas exchange in plants.
