  abstract: Plants cannot change location to escape stressful environments. Therefore, plants evolved to respond and acclimate
    to diverse stimuli, including the seemingly innocuous touch stimulus [1-4]. Although some species, such as Venus flytrap,
    have fast touch responses, most plants display more gradual touch-induced morphological alterations, called thigmomorphogenesis
    [2, 3, 5, 6]. Thigmomorphogenesis may be adaptive; trees subjected to winds develop less elongated and thicker trunks
    and thus are less likely damaged by powerful wind gusts [7]. Despite the widespread relevance of thigmomorphogenesis,
    the regulation that underlies plant mechanostimulus-induced morphological responses remains largely unknown. Furthermore,
    whether thigmomorphogenesis confers additional advantage is not fully understood. Although aspects of thigmomorphogenesis
    resemble ethylene effects [8], and touch can induce ethylene synthesis [9, 10], Arabidopsis ethylene response mutants
    show touch-induced thigmomorphogenesis [11]; thus, ethylene response is nonessential for thigmomorphogenesis. Here we
    show that jasmonate (JA) phytohormone both is required for and promotes the salient characteristics of thigmomorphogenesis
    in Arabidopsis, including a touch-induced delay in flowering and rosette diameter reduction. Furthermore, we find that
    repetitive mechanostimulation enhances Arabidopsis pest resistance in a JA-dependent manner. These results highlight an
    important role for JA in mediating mechanostimulus-induced plant developmental responses and resultant cross-protection
    against biotic stress.
