  abstract: Because water is essential to life, organisms have evolved a wide range of strategies to cope with water limitations,
    including actively searching for their preferred moisture levels to avoid dehydration. Plants use moisture gradients to
    direct their roots through the soil once a water source is detected, but how they first detect the source is unknown.
    We used the model plant Pisum sativum to investigate the mechanism by which roots sense and locate water. We found that
    roots were able to locate a water source by sensing the vibrations generated by water moving inside pipes, even in the
    absence of substrate moisture. When both moisture and acoustic cues were available, roots preferentially used moisture
    in the soil over acoustic vibrations, suggesting that acoustic gradients enable roots to broadly detect a water source
    at a distance, while moisture gradients help them to reach their target more accurately. Our results also showed that
    the presence of noise affected the abilities of roots to perceive and respond correctly to the surrounding soundscape.
    These findings highlight the urgent need to better understand the ecological role of sound and the consequences of acoustic
    pollution for plant as well as animal populations.
