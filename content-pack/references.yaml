  abstract: Phytochromes are plant photoreceptors that perceive red and far-red light. Upon the perception of light in Arabidopsis,
    light-activated phytochromes enter the nucleus and act on a set of interacting proteins, modulating their activities and
    thereby altering the expression levels of ∼10% of the organism's entire gene complement. Phytochromeinteracting factors
    (PIFs) belonging to Arabidopsis basic helix-loop-helix (bHLH) subgroup 15 are key interacting proteins that play negative
    roles in light responses. Their activities are post-translationally countered by light-activated phytochromes, which promote
    the degradation of PIFs and directly or indirectly inhibit their binding to DNA. The PIFs share a high degree of similarity,
    but examinations of pif single and multiple mutants have indicated that they have shared and distinct functions in various
    developmental and physiological processes. These are believed to stem from differences in both intrinsic protein properties
    and their gene expression patterns. In an effort to clarify the basis of these shared and distinct functions, we compared
    recently published genome-wide ChIP data, developmental gene expression maps, and responses to various stimuli for the
    various PIFs. Based on our observations, we propose that the biological roles of PIFs stem from their shared and distinct
    DNA binding targets and specific gene expression patterns.
