  abstract: Typically at dawn on a hot summer day, land plants need precise molecular thermometers to sense harmless increments
    in the ambient temperature to induce a timely heat shock response (HSR) and accumulate protective heat shock proteins
    in anticipation of harmful temperatures at mid-day. Here, we found that the cyclic nucleotide gated calcium channel (CNGC)
    CNGCb gene from Physcomitrella patens and its Arabidopsis thaliana ortholog CNGC2, encode a component of cyclic nucleotide
    gated Ca(2+) channels that act as the primary thermosensors of land plant cells. Disruption of CNGCb or CNGC2 produced
    a hyper-thermosensitive phenotype, giving rise to an HSR and acquired thermotolerance at significantly milder heat-priming
    treatments than in wild-type plants. In an aequorin-expressing moss, CNGCb loss-of-function caused a hyper-thermoresponsive
