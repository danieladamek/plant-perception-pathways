  abstract: Nucleotide-binding, leucine-rich repeat receptors (NLRs) are major immune receptors in plants and animals. Upon
    activation, the Arabidopsis NLR protein ZAR1 forms a pentameric resistosome in vitro and triggers immune responses and
    cell death in plants. In this study, we employed single-molecule imaging to show that the activated ZAR1 protein can form
    pentameric complexes in the plasma membrane. The ZAR1 resistosome displayed ion channel activity in Xenopus oocytes in
    a manner dependent on a conserved acidic residue Glu11 situated in the channel pore. Pre-assembled ZAR1 resistosome was
