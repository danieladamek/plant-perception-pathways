  abstract: Plants induce defense responses after insect egg deposition, but very little is known about the perception mechanisms.
    In Arabidopsis thaliana, eggs of the specialist insect Pieris brassicae trigger accumulation of reactive oxygen species
    (ROS) and salicylic acid (SA), followed by induction of defense genes and localized necrosis. Here, the involvement of
    the clade I L-type lectin receptor kinase LecRK-I.8 in these responses was studied. Expression of LecRK-I.8 was upregulated
