    from siblings, strangers (non-siblings), or only their own exudates. In one experiment, root secretions were inhibited
    by sodium orthovanadate and root length and number of lateral roots were measured. In a second experiment, responses to
    siblings, strangers, and their own exudates were measured for several accessions (genotypes), and the traits of length
