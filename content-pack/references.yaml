  abstract: The COP1 (constitutive photomorphogenic 1) protein, comprising RING finger, coiled-coil and WD40 domains, is conserved
    in both higher plants and vertebrates. In plants, COP1 acts as an E3 ubiquitin ligase to repress light signaling by targeting
    photoreceptors and downstream transcription factors for ubiquitylation and degradation. The activity of COP1 in plant
    cells correlates with its cytoplasmic and nuclear partitioning according to dark or light conditions. In addition, various
    signaling molecules have been shown to directly interact with COP1 and modulate its activity. Recently, scientists have
    begun to probe the function and regulation of COP1 in mammalian systems. Initial studies have pointed at possible roles
    for mammalian COP1 in tumorigenesis and the stress response through regulating the activities of p53 and c-Jun.
