  abstract: Mutualistic symbioses between eukaryotes and beneficial microorganisms of their microbiome play an essential role
    in nutrition, protection against disease, and development of the host. However, the impact of beneficial symbionts on
    the evolution of host genomes remains poorly characterized. Here we used the independent loss of the most widespread plant-microbe
    symbiosis, arbuscular mycorrhization (AM), as a model to address this question. Using a large phenotypic approach and
    phylogenetic analyses, we present evidence that loss of AM symbiosis correlates with the loss of many symbiotic genes
    in the Arabidopsis lineage (Brassicales). Then, by analyzing the genome and/or transcriptomes of nine other phylogenetically
    divergent non-host plants, we show that this correlation occurred in a convergent manner in four additional plant lineages,
    demonstrating the existence of an evolutionary pattern specific to symbiotic genes. Finally, we use a global comparative
    phylogenomic approach to track this evolutionary pattern among land plants. Based on this approach, we identify a set
    of 174 highly conserved genes and demonstrate enrichment in symbiosis-related genes. Our findings are consistent with
    the hypothesis that beneficial symbionts maintain purifying selection on host gene networks during the evolution of entire
    lineages.
